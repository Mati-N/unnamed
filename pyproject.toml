[tool.poetry]
name = "feel"
version = "0.1.0"
description = "A social media learning project upgraded to modern dependencies"
authors = ["Mati <mathiaskassaye8@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
cloudinary = "^1.44.1"
django = "^4.2.16"
django-cloudinary-storage = "^0.3.0"
django-filter = "^25.1"
django-graphql-jwt = "^0.4.0"
djangorestframework = "^3.16.1"
graphene = "^3.4.3"
graphene-django = "^3.2.3"
graphene-file-upload = "^1.3.0"
gunicorn = "^23.0.0"
pillow = "^11.3.0"
whitenoise = {extras = ["brotli"], version = "^6.10.0"}

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
